services:
  # frontend:
  #     build:
  #       context: ./src/frontend
  #       dockerfile: Dockerfile
  #     ports:
  #       - "5000:5000"
  db:
    image: postgres:18
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql
    env_file:
      - src/backend/.env
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
volumes:
  db_data:
  redis_data:
